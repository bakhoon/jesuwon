# main 브랜치에 push 하면 자동으로 빌드해서 GitHub Pages 에 올려요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:       # Actions 탭에서 [Run workflow] 버튼으로 바로 실행
  schedule:
    - cron: '0 9 * * *'    # 매일 새벽 4시(동부 시간)쯤, 드라이브 새 사진 가져오기

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync banners from Google Drive
        run: npm run sync
        continue-on-error: true   # 드라이브가 안 되어도 사이트 배포는 계속
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - name: Build
        run: npm run build
        env:
          # https://<계정>.github.io/<저장소이름>/ 에 맞춰 경로를 붙여요
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
